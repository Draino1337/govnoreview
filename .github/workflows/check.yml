name: check
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      # build = данные + typecheck + vite build в docs/
      - run: npm run build
      - name: docs/ и данные закоммичены после сборки
        run: git status --porcelain && git diff --exit-code && test -z "$(git status --porcelain)"
